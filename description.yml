# Community-extensions submission descriptor for the `quackapi` extension.
# Keep in sync with /description.yml at the repository root.
#
# Submit this file under extensions/quackapi/description.yml in the community
# extensions repository and set repo.ref to the exact release commit.

extension:
  name: quackapi
  description: >-
    Define typed HTTP routes in DuckDB SQL, protect routes with API-key or
    HS256 JWT authentication, and call upstream HTTP services with quackapi_post.
  version: 0.1.3
  language: C++
  build: cmake
  license: MIT
  maintainers:
    - asubbarao
  excluded_platforms: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;windows_arm64

repo:
  github: asubbarao/quackapi
  # Set to the exact release commit SHA before submitting to community-extensions.
  ref: af29123f53790ce824d0e0cb6b4590e43cb8cd0f

docs:
  hello_world: |
    LOAD json;
    LOAD quackapi;

    CREATE ROUTE hello GET '/hello' AS SELECT 'world' AS msg;
    CREATE ROUTE item GET '/items/:id' AS SELECT $id::INTEGER AS id;

    SELECT * FROM quackapi_serve(8000);

  extended_description: |
    # quackapi

    QuackAPI serves SQL-backed HTTP routes from DuckDB. Route parameters bind
    through prepared SQL parameters and type failures return structured 422
    responses. API keys and HS256 JWTs can protect routes with `REQUIRE`.
    Route groups provide path prefixes, default authentication, and OpenAPI
    tags. OpenAPI, Swagger UI, ReDoc, static files, CORS, response compression,
    request deadlines, and response-size limits are available on the HTTP
    server.

    `quackapi_post(url, body[, content_type[, headers]])` issues volatile POST
    requests through DuckDB's HTTPUtil provider. Load a POST-capable provider
    explicitly before calling it: `curl_httpfs` is recommended; `httpfs` is
    also supported. QuackAPI does not install outbound providers automatically.
    The result reports status, reason, body, headers, transport error, and
    whether that worker reused its connection.

    Route authentication is an application-route boundary. It does not provide
    database-wide row-level security or rewrite arbitrary DuckDB SQL by tenant.
    DuckDB ordinary SQL retains its database-file concurrency semantics; HTTP
    worker concurrency does not turn the database into a multi-writer OLTP
    service. See the repository migration guide for removed APIs and gaps.

    Build targets DuckDB v1.5.6. The extension uses DuckDB's bundled HTTP server
    and crypto libraries; outbound requests use an explicitly loaded HTTPUtil
    provider. Load DuckDB's JSON extension before serving routes that use JSON.
    The extension build declares JSON as a dependency; QuackAPI does not
    install it as a side effect.

    Full reference: https://github.com/asubbarao/quackapi
    Migration guide: https://github.com/asubbarao/quackapi/blob/main/docs/MIGRATION.md
