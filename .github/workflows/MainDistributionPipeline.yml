#
# Build, test, and (on tags) publish extension binaries.
#
# Single supported DuckDB host: v1.5.5
# Platforms (extension-ci-tools): linux_amd64, linux_arm64, osx_amd64,
#   osx_arm64, windows_amd64
# Excludes: wasm / MinGW / rtools / windows_arm64
#
# Tag push (v*) attaches artifacts to the GitHub Release.
#
name: Main Extension Distribution Pipeline
# Feature branches are covered by `pull_request`. Building them again on
# `push` doubled every run (5 platforms x2) and mailed two failures per
# mistake, so `push` is limited to main and release tags.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The group deliberately omits `github.sha`: including it made every commit
# its own group, so nothing ever superseded anything and stale runs raced
# their own fixups to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    # Pin workflow+ci-tools to a main SHA that exposes the `runners` input
    # (absent on v1.5-variegata). windows-latest currently resolves to
    # windows-2025-vs2026; MSVC 14.51 dropped stdext::checked_array_iterator
    # and breaks DuckDB's vendored fmt (format.h C2653). Keep shipping
    # windows_amd64 on VS 2022.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@26d4b617b6957ce2283a48294d18c5f9581ac456
    with:
      duckdb_version: v1.5.5
      ci_tools_version: 26d4b617b6957ce2283a48294d18c5f9581ac456
      extension_name: quackapi
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;windows_arm64
      runners: '{"windows_x64":"windows-2022"}'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: quackapi
      format_checks: "format"

  publish-github-release:
    name: Publish GitHub Release assets
    needs: [duckdb-stable-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all extension artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "quackapi-*-extension-*"
          merge-multiple: false

      - name: Stage release files
        run: |
          set -euo pipefail
          mkdir -p release_assets
          find artifacts -type f \( -name '*.duckdb_extension' -o -name '*.duckdb_extension.gz' \) | while read -r f; do
            parent="$(basename "$(dirname "$f")")"
            base="$(basename "$f")"
            ver_arch="${parent#quackapi-}"
            ver="${ver_arch%%-extension-*}"
            arch="${ver_arch#*-extension-}"
            if [[ "$base" == *.duckdb_extension.gz ]]; then
              out="quackapi-duckdb-${ver}-${arch}.duckdb_extension.gz"
            else
              out="quackapi-duckdb-${ver}-${arch}.duckdb_extension"
            fi
            cp -v "$f" "release_assets/${out}"
          done
          ls -la release_assets
          test "$(find release_assets -type f | wc -l)" -gt 0

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
