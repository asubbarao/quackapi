#
# Build, test, and (on tags) publish extension binaries.
#
# Single supported DuckDB host: v1.5.6
# Platforms (extension-ci-tools): linux_amd64, linux_arm64, osx_amd64,
#   osx_arm64, windows_amd64
# Excludes: wasm / MinGW / rtools / windows_arm64
#
# Tag push (v*) attaches artifacts to the GitHub Release.
#
name: Main Extension Distribution Pipeline
# Feature branches are covered by `pull_request`. Building them again on
# `push` doubled every run (5 platforms x2) and mailed two failures per
# mistake, so `push` is limited to main and release tags.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The group deliberately omits `github.sha`: including it made every commit
# its own group, so nothing ever superseded anything and stale runs raced
# their own fixups to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    # Pin the workflow and its checkout to the DuckDB v1.5.6 CI-tools tag.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: quackapi
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;windows_arm64

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: quackapi
      format_checks: "format"

  # Focused Linux validation for the SQLLogic suite and real HTTP contracts.
  # The released extension uses DuckDB SQL only; no external database service
  # is required.
  linux-amd64-sqllogic:
    name: Linux amd64 SQLLogic
    runs-on: ubuntu-24.04
    env:
      GEN: ninja
      DUCKDB_GIT_VERSION: v1.5.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout extension-ci-tools
        uses: actions/checkout@v4
        with:
          repository: duckdb/extension-ci-tools
          ref: v1.5.6
          path: extension-ci-tools

      - name: Checkout DuckDB v1.5.6
        run: make set_duckdb_version

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        continue-on-error: true
        with:
          key: ccache-quackapi-sqllogic-linux-amd64-v1.5.6
          restore-keys: ccache-quackapi-sqllogic-linux-amd64-

      - name: Build extension
        run: make release -j"$(nproc)"

      - name: Run quackapi SQLLogic
        run: ./build/release/test/unittest "test/sql/quackapi*"

      - name: Verify request database lifetime
        run: |
          c++ -std=c++17 -pthread -Wall -Wextra -Werror -isystem duckdb/src/include test/cpp/quackapi_lifetime_test.cpp -Lbuild/release/src -lduckdb -Wl,-rpath,"$PWD/build/release/src" -o /tmp/quackapi-lifetime-test
          /tmp/quackapi-lifetime-test

      - name: Verify outbound POST over real HTTP
        run: |
          extension_dir="$PWD/build/release/post_http_extensions"
          ./build/release/duckdb -unsigned -c "SET extension_directory='$extension_dir'; INSTALL curl_httpfs FROM community;"
          duckdb_platform="$(./build/release/duckdb -unsigned -noheader -list -c 'SELECT platform();')"
          provider_artifact="$extension_dir/v1.5.6/$duckdb_platform/curl_httpfs.duckdb_extension"
          quackapi_artifact="$PWD/build/release/extension/quackapi/quackapi.duckdb_extension"
          quackapi_version="$(git rev-parse --short HEAD)"
          cmake -S test/cpp -B build/post_http_test \
            -DQUACKAPI_EXTENSION="$quackapi_artifact" \
            -DQUACKAPI_VERSION="$quackapi_version" \
            -DPOST_PROVIDER_EXTENSION="$provider_artifact" \
            -DPOST_PROVIDER_VERSION=v0.4.5
          cmake --build build/post_http_test -j"$(nproc)"
          ctest --test-dir build/post_http_test --output-on-failure

      - name: Verify benchmark correctness gates
        run: |
          python3 bench/test_bench_config.py
          bash bench/test_harness.sh
          bash bench/test_report.sh
          python3 test/conformance/test_driver.py

      - name: Verify real HTTP contracts
        run: bash test/conformance/run.sh

  publish-github-release:
    name: Publish GitHub Release assets
    needs: [duckdb-stable-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all extension artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "quackapi-*-extension-*"
          merge-multiple: false

      - name: Stage release files
        run: |
          set -euo pipefail
          mkdir -p release_assets
          find artifacts -type f \( -name '*.duckdb_extension' -o -name '*.duckdb_extension.gz' \) | while read -r f; do
            parent="$(basename "$(dirname "$f")")"
            base="$(basename "$f")"
            ver_arch="${parent#quackapi-}"
            ver="${ver_arch%%-extension-*}"
            arch="${ver_arch#*-extension-}"
            if [[ "$base" == *.duckdb_extension.gz ]]; then
              out="quackapi-duckdb-${ver}-${arch}.duckdb_extension.gz"
            else
              out="quackapi-duckdb-${ver}-${arch}.duckdb_extension"
            fi
            cp -v "$f" "release_assets/${out}"
          done
          ls -la release_assets
          test "$(find release_assets -type f | wc -l)" -gt 0

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
