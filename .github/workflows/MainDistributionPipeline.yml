#
# Build, test, and (on tags) publish extension binaries.
#
# Host support floor: DuckDB v1.5.3 (quack) and later on the 1.5 line.
#
# Matrix policy:
#   - push / pull_request → smoke build for tip only (v1.5.5)
#   - workflow_dispatch with multi_version=true (default) → full matrix
#   - tag push (v*) → full matrix + GitHub Release assets
#
# Platforms (via extension-ci-tools): linux_amd64, linux_arm64, osx_amd64,
# osx_arm64, windows_amd64. Excludes wasm / MinGW / rtools / windows_arm64.
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      multi_version:
        description: "Build all supported DuckDB hosts (v1.5.3, v1.5.4, v1.5.5)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  resolve-matrix:
    name: Resolve DuckDB version matrix
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set.outputs.versions }}
      multi: ${{ steps.set.outputs.multi }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          MULTI=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.multi_version }}" == "true" ]]; then
              MULTI=true
            fi
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            MULTI=true
          fi
          if $MULTI; then
            # Floor = quack host v1.5.3; tip = community latest stable
            echo 'versions=["v1.5.3","v1.5.4","v1.5.5"]' >> "$GITHUB_OUTPUT"
            echo "multi=true" >> "$GITHUB_OUTPUT"
            echo "Full matrix: v1.5.3 v1.5.4 v1.5.5"
          else
            echo 'versions=["v1.5.5"]' >> "$GITHUB_OUTPUT"
            echo "multi=false" >> "$GITHUB_OUTPUT"
            echo "Smoke: v1.5.5 only"
          fi

  duckdb-stable-build:
    name: Build extension binaries (${{ matrix.duckdb_version }})
    needs: resolve-matrix
    strategy:
      fail-fast: false
      matrix:
        duckdb_version: ${{ fromJson(needs.resolve-matrix.outputs.versions) }}
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: ${{ matrix.duckdb_version }}
      ci_tools_version: v1.5-variegata
      extension_name: quackapi
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;windows_arm64
      artifact_postfix: ""

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: quackapi
      # format only — tidy needs per-repo tuning
      format_checks: "format"

  # On tag pushes: attach all built .duckdb_extension artifacts to the GitHub Release.
  publish-github-release:
    name: Publish GitHub Release assets
    needs: [resolve-matrix, duckdb-stable-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all extension artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "quackapi-*-extension-*"
          merge-multiple: false

      - name: Stage release files
        run: |
          set -euo pipefail
          mkdir -p release_assets
          find artifacts -type f \( -name '*.duckdb_extension' -o -name '*.duckdb_extension.gz' -o -name '*.duckdb_extension.wasm' \) | while read -r f; do
            parent="$(basename "$(dirname "$f")")"
            base="$(basename "$f")"
            # parent = quackapi-<ver>-extension-<arch>
            ver_arch="${parent#quackapi-}"
            ver="${ver_arch%%-extension-*}"
            arch="${ver_arch#*-extension-}"
            if [[ "$base" == *.duckdb_extension.gz ]]; then
              out="quackapi-duckdb-${ver}-${arch}.duckdb_extension.gz"
            elif [[ "$base" == *.duckdb_extension ]]; then
              out="quackapi-duckdb-${ver}-${arch}.duckdb_extension"
            else
              out="quackapi-duckdb-${ver}-${arch}.${base##*.}"
            fi
            cp -v "$f" "release_assets/${out}"
          done
          ls -la release_assets
          test "$(find release_assets -type f | wc -l)" -gt 0

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
