#
# Build, test, and (on tags) publish extension binaries.
#
# Single supported DuckDB host: v1.5.6
# Platforms (extension-ci-tools): linux_amd64, linux_arm64, osx_amd64,
#   osx_arm64, windows_amd64
# Excludes: wasm / MinGW / rtools / windows_arm64
#
# Tag push (v*) attaches artifacts to the GitHub Release.
#
name: Main Extension Distribution Pipeline
# Feature branches are covered by `pull_request`. Building them again on
# `push` doubled every run (5 platforms x2) and mailed two failures per
# mistake, so `push` is limited to main and release tags.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The group deliberately omits `github.sha`: including it made every commit
# its own group, so nothing ever superseded anything and stale runs raced
# their own fixups to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    # Pin the workflow and its checkout to the DuckDB v1.5.6 CI-tools tag.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: quackapi
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;windows_arm64

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: quackapi
      format_checks: "format"

  # Focused Linux validation for the SQLLogic suite and real HTTP contracts.
  # The released extension uses DuckDB SQL only; no external database service
  # is required.
  linux-amd64-sqllogic:
    name: Linux amd64 SQLLogic
    runs-on: ubuntu-24.04
    env:
      GEN: ninja
      DUCKDB_GIT_VERSION: v1.5.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout extension-ci-tools
        uses: actions/checkout@v4
        with:
          repository: duckdb/extension-ci-tools
          ref: v1.5.6
          path: extension-ci-tools

      - name: Checkout DuckDB v1.5.6
        run: make set_duckdb_version

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libssl-dev

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        continue-on-error: true
        with:
          key: ccache-quackapi-sqllogic-linux-amd64-v1.5.6
          restore-keys: ccache-quackapi-sqllogic-linux-amd64-

      - name: Build extension
        run: make release -j"$(nproc)"

      - name: Run quackapi SQLLogic
        run: ./build/release/test/unittest "test/sql/quackapi*"

      - name: Run BODY SCHEMA SQLLogic coverage with local json_schema
        run: |
          set -euo pipefail
          extension_repo="$PWD/build/release/repository"
          community_extension_dir="$RUNNER_TEMP/quackapi-community-extensions"
          test_extension_dir="$RUNNER_TEMP/quackapi-test-extensions"
          test_config="$RUNNER_TEMP/quackapi-test-config.json"
          mkdir -p "$community_extension_dir" "$test_extension_dir" "$extension_repo/v1.5.6/linux_amd64"
          ./build/release/duckdb -no-stdin -c "SET extension_directory='$community_extension_dir'; INSTALL json_schema FROM community;"
          cp "$community_extension_dir/v1.5.6/linux_amd64/json_schema.duckdb_extension" \
            "$extension_repo/v1.5.6/linux_amd64/"
          cat > "$test_config" <<EOF
          {"autoloading":"available","settings":[{"name":"extension_directory","value":"$test_extension_dir"}]}
          EOF
          log_file="$(mktemp)"
          LOCAL_EXTENSION_REPO="$extension_repo" ./build/release/test/unittest \
            --test-dir "$PWD" --test-config "$test_config" \
            "test/sql/quackapi_body_schema.test" 2>&1 | tee "$log_file"
          if grep -Eiq "skip.*require json_schema|require json_schema.*skip" "$log_file"; then
            echo "BODY SCHEMA coverage was skipped because json_schema was unavailable" >&2
            exit 1
          fi
          if ! grep -Eq "16 assertions" "$log_file"; then
            echo "Expected all 16 BODY SCHEMA assertions to run" >&2
            exit 1
          fi

      - name: Verify request database lifetime
        run: |
          c++ -std=c++17 -pthread -Wall -Wextra -Werror -isystem duckdb/src/include test/cpp/quackapi_lifetime_test.cpp -Lbuild/release/src -lduckdb -Wl,-rpath,"$PWD/build/release/src" -o /tmp/quackapi-lifetime-test
          /tmp/quackapi-lifetime-test

      - name: Build pinned curl_httpfs POST provider
        uses: actions/checkout@v4
        with:
          repository: asubbarao-ifr/duckdb-curl-filesystem
          ref: a48f83c6198a0252672f6f696e446e1525745a8a
          path: provider-curl-httpfs
          submodules: recursive

      - name: Build pinned HTTPFS-Curl POST provider
        uses: actions/checkout@v4
        with:
          repository: asubbarao-ifr/duckdb-httpfs
          ref: 748f5ac8dddee531384d9901387d43b0f6a2db43
          path: provider-httpfs-curl
          submodules: recursive

      - name: Build provider artifacts against the tested DuckDB core
        run: |
          duckdb_core="$PWD/build/release/src/libduckdb_static.a"
          test -f "$duckdb_core"
          test "$(git -C provider-curl-httpfs rev-parse HEAD)" = a48f83c6198a0252672f6f696e446e1525745a8a
          test "$(git -C provider-httpfs-curl rev-parse HEAD)" = 748f5ac8dddee531384d9901387d43b0f6a2db43
          test "$(git -C provider-curl-httpfs/duckdb rev-parse HEAD)" = 069cc9f9b5be802405797faecc284961b07c70ef
          test "$(git -C provider-httpfs-curl/duckdb rev-parse HEAD)" = 069cc9f9b5be802405797faecc284961b07c70ef
          make -C provider-curl-httpfs release -j"$(nproc)" \
            EXTENSION_STATIC_BUILD=1 \
            EXT_FLAGS="-DPREBUILT_BINARY=$duckdb_core" \
            OVERRIDE_GIT_DESCRIBE=v1.5.6
          make -C provider-httpfs-curl release -j"$(nproc)" \
            EXTENSION_STATIC_BUILD=1 \
            EXT_FLAGS="-DPREBUILT_BINARY=$duckdb_core" \
            OVERRIDE_GIT_DESCRIBE=v1.5.6

      - name: Verify outbound POST over real HTTP with both providers
        run: |
          quackapi_artifact="$PWD/build/release/extension/quackapi/quackapi.duckdb_extension"
          quackapi_version="$(git rev-parse --short HEAD)"
          curl_provider="$PWD/provider-curl-httpfs/build/release/extension/curl_httpfs/curl_httpfs.duckdb_extension"
          httpfs_provider="$PWD/provider-httpfs-curl/build/release/extension/httpfs/httpfs.duckdb_extension"
          cmake -S test/cpp -B build/post_http_test_curl \
            -DQUACKAPI_EXTENSION="$quackapi_artifact" \
            -DQUACKAPI_VERSION="$quackapi_version" \
            -DPOST_PROVIDER_EXTENSION="$curl_provider" \
            -DPOST_PROVIDER_NAME=curl_httpfs \
            -DPOST_PROVIDER_VERSION=v0.4.5 \
            -DENABLE_PROVIDER_REPLACEMENT=ON \
            -DCURL_HTTPFS_EXTENSION="$curl_provider" \
            -DCURL_HTTPFS_VERSION=v0.4.5 \
            -DHTTPFS_EXTENSION="$httpfs_provider" \
            -DHTTPFS_VERSION=748f5ac
          cmake --build build/post_http_test_curl -j"$(nproc)"
          ctest --test-dir build/post_http_test_curl --output-on-failure
          cmake -S test/cpp -B build/post_http_test_httpfs \
            -DQUACKAPI_EXTENSION="$quackapi_artifact" \
            -DQUACKAPI_VERSION="$quackapi_version" \
            -DPOST_PROVIDER_EXTENSION="$httpfs_provider" \
            -DPOST_PROVIDER_NAME=httpfs \
            -DPOST_PROVIDER_VERSION=748f5ac
          cmake --build build/post_http_test_httpfs -j"$(nproc)"
          ctest --test-dir build/post_http_test_httpfs --output-on-failure

      - name: Verify benchmark correctness gates
        run: |
          python3 bench/test_bench_config.py
          bash bench/test_harness.sh
          bash bench/test_report.sh
          python3 test/conformance/test_driver.py

      - name: Verify real HTTP contracts
        run: bash test/conformance/run.sh

  publish-github-release:
    name: Publish GitHub Release assets
    needs: [duckdb-stable-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all extension artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "quackapi-*-extension-*"
          merge-multiple: false

      - name: Stage release files
        run: |
          set -euo pipefail
          mkdir -p release_assets
          find artifacts -type f \( -name '*.duckdb_extension' -o -name '*.duckdb_extension.gz' \) | while read -r f; do
            parent="$(basename "$(dirname "$f")")"
            base="$(basename "$f")"
            ver_arch="${parent#quackapi-}"
            ver="${ver_arch%%-extension-*}"
            arch="${ver_arch#*-extension-}"
            if [[ "$base" == *.duckdb_extension.gz ]]; then
              out="quackapi-duckdb-${ver}-${arch}.duckdb_extension.gz"
            else
              out="quackapi-duckdb-${ver}-${arch}.duckdb_extension"
            fi
            cp -v "$f" "release_assets/${out}"
          done
          ls -la release_assets
          test "$(find release_assets -type f | wc -l)" -gt 0

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
