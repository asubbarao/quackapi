#
# Build, test, and (on tags) publish extension binaries.
#
# Single supported DuckDB host: v1.5.5
# Platforms (extension-ci-tools): linux_amd64, linux_arm64, osx_amd64,
#   osx_arm64, windows_amd64
# Excludes: wasm / MinGW / rtools / windows_arm64
#
# Tag push (v*) attaches artifacts to the GitHub Release.
#
name: Main Extension Distribution Pipeline
# Feature branches are covered by `pull_request`. Building them again on
# `push` doubled every run (5 platforms x2) and mailed two failures per
# mistake, so `push` is limited to main and release tags.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The group deliberately omits `github.sha`: including it made every commit
# its own group, so nothing ever superseded anything and stale runs raced
# their own fixups to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    # Pin workflow+ci-tools to a main SHA that exposes the `runners` input
    # (absent on v1.5-variegata). windows-latest currently resolves to
    # windows-2025-vs2026; MSVC 14.51 dropped stdext::checked_array_iterator
    # and breaks DuckDB's vendored fmt (format.h C2653). Keep shipping
    # windows_amd64 on VS 2022.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@26d4b617b6957ce2283a48294d18c5f9581ac456
    with:
      duckdb_version: v1.5.5
      ci_tools_version: 26d4b617b6957ce2283a48294d18c5f9581ac456
      extension_name: quackapi
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;windows_arm64
      runners: '{"windows_x64":"windows-2022"}'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: quackapi
      format_checks: "format"

  # Own job (not the reusable distribution workflow): needs `services:` for
  # Postgres so require-env QUACKAPI_TEST_PG_DSN tests actually run. Linux
  # amd64 only — does not publish artifacts or expand the release matrix.
  linux-amd64-pg-sqllogic:
    name: Linux amd64 SQLLogic with Postgres
    runs-on: ubuntu-24.04
    env:
      GEN: ninja
      DUCKDB_GIT_VERSION: v1.5.5
      ENABLE_EXTENSION_AUTOLOADING: "1"
      ENABLE_EXTENSION_AUTOINSTALL: "1"
      QUACKAPI_TEST_PG_DSN: postgresql://quackapi_pg_cache:qa_pg_cache_test@127.0.0.1:5432/quackapi_pg_cache_test
      # BODY SCHEMA runs the community json_schema extension, which quackapi
      # installs on first use. This job has the network and the tagged DuckDB
      # build that makes that install resolve; a dev machine may not.
      QUACKAPI_TEST_JSON_SCHEMA: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quackapi_pg_cache
          POSTGRES_PASSWORD: qa_pg_cache_test
          POSTGRES_DB: quackapi_pg_cache_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quackapi_pg_cache -d quackapi_pg_cache_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout extension-ci-tools
        uses: actions/checkout@v4
        with:
          repository: duckdb/extension-ci-tools
          ref: v1.5-variegata
          path: extension-ci-tools

      - name: Checkout DuckDB v1.5.5
        run: make set_duckdb_version

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libpq-dev postgresql-client

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        continue-on-error: true
        with:
          key: ccache-quackapi-pg-sqllogic-linux-amd64-v1.5.5
          restore-keys: ccache-quackapi-pg-sqllogic-linux-amd64-

      - name: Wait for Postgres
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U quackapi_pg_cache -d quackapi_pg_cache_test; do
            sleep 1
          done

      # This job is the only one that exercises the native Postgres path, and it
      # is not a publishing job — opting in here keeps the distributed binaries
      # free of a libpq load-time dependency.
      - name: Build extension
        run: EXT_RELEASE_FLAGS="-DQUACKAPI_ENABLE_LIBPQ=ON" make release -j"$(nproc)"

      - name: Run quackapi SQLLogic
        run: ./build/release/test/unittest "test/sql/quackapi*"

      - name: Verify outbound worker cleanup
        run: |
          c++ -std=c++17 -pthread -Wall -Wextra -Werror -Isrc/include test/cpp/quackapi_thread_join_test.cpp -o /tmp/quackapi-thread-join-test
          /tmp/quackapi-thread-join-test

      - name: Verify build without libpq
        run: c++ -std=c++17 -fsyntax-only -isystem duckdb/src/include -Isrc/include src/quackapi_pg.cpp

      - name: Verify request database lifetime
        run: |
          c++ -std=c++17 -pthread -Wall -Wextra -Werror -isystem duckdb/src/include test/cpp/quackapi_lifetime_test.cpp -Lbuild/release/src -lduckdb -Wl,-rpath,"$PWD/build/release/src" -o /tmp/quackapi-lifetime-test
          /tmp/quackapi-lifetime-test

      - name: Verify benchmark correctness gates
        run: |
          python3 bench/test_bench_config.py
          bash bench/test_harness.sh
          bash bench/test_report.sh
          python3 test/conformance/test_driver.py

      - name: Verify real HTTP contracts
        run: bash test/conformance/run.sh

  publish-github-release:
    name: Publish GitHub Release assets
    needs: [duckdb-stable-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all extension artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "quackapi-*-extension-*"
          merge-multiple: false

      - name: Stage release files
        run: |
          set -euo pipefail
          mkdir -p release_assets
          find artifacts -type f \( -name '*.duckdb_extension' -o -name '*.duckdb_extension.gz' \) | while read -r f; do
            parent="$(basename "$(dirname "$f")")"
            base="$(basename "$f")"
            ver_arch="${parent#quackapi-}"
            ver="${ver_arch%%-extension-*}"
            arch="${ver_arch#*-extension-}"
            if [[ "$base" == *.duckdb_extension.gz ]]; then
              out="quackapi-duckdb-${ver}-${arch}.duckdb_extension.gz"
            else
              out="quackapi-duckdb-${ver}-${arch}.duckdb_extension"
            fi
            cp -v "$f" "release_assets/${out}"
          done
          ls -la release_assets
          test "$(find release_assets -type f | wc -l)" -gt 0

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
